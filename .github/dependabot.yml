version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      # semver-major-days is not permitted for github-actions; Dependabot would
      # reject the whole file.
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # The base image of the Linux build container, pinned by digest.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies

  # SPDX validator, hash-locked.
  - package-ecosystem: pip
    directory: /tools/release
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
    labels:
      - dependencies
