name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-hygiene:
    name: Commit Hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check pull request and commit attribution
        run: tools/check-commit-hygiene.sh

  quality:
    name: Repository Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned CI tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep shellcheck file libarchive-tools
          tools/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install the locked SPDX validator
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.8.17
      - name: Prepare the validation environment
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/spdx-validation"
          uv pip sync --python "$RUNNER_TEMP/spdx-validation/bin/python" \
            --require-hashes tools/release/requirements.txt
      - name: Validate repository and quality gates
        run: |
          set -euo pipefail
          make repository-audit
          make quality-gates
          make shellcheck
          make actionlint
          make secrets-scan
      - name: Validate a generated SBOM with the official SPDX validator
        run: |
          set -euo pipefail
          printf 'sample' > "$RUNNER_TEMP/sample.tar.xz"
          . ./pins.env
          python3 tools/release/generate-sbom.py pins.env "$RUNNER_TEMP/sample.tar.xz" \
            "$RUNNER_TEMP/sample.tar.xz.spdx.json" "$VERSION" "$GITHUB_SHA" 0
          "$RUNNER_TEMP/spdx-validation/bin/python" tools/release/validate-sbom.py \
            "$RUNNER_TEMP/sample.tar.xz.spdx.json"

  patches:
    name: Patches Fit the Pinned Sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unpack the pinned sources and apply every patch
        run: make patches-check

  # Pull requests that touch only documentation, repository tooling or the other workflows skip the
  # three toolchain builds. Pushes to main and manual runs always build. tools/plan-ci.sh selects the
  # full scope for every path it does not know, and CI Success refuses a skipped build without this
  # verdict.
  plan:
    name: Plan the Build Scope
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ $EVENT == pull_request ]]; then
            git diff --name-only --no-renames "$BASE...$HEAD" | tools/plan-ci.sh >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  build:
    name: Build and Test (${{ matrix.host }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: linux-x86_64, runner: ubuntu-24.04 }
          - { host: linux-arm64, runner: ubuntu-24.04-arm }
          - { host: macos-arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the pinned SDK and sources
        run: scripts/fetch.sh all
      - name: Build, package and test in the pinned container
        if: startsWith(matrix.host, 'linux-')
        run: JOBS="$(nproc)" scripts/docker-build.sh
      - name: Package the Debian package and install it in clean containers
        if: startsWith(matrix.host, 'linux-')
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          . ./pins.env
          arch=amd64
          [[ "$HOST" == linux-arm64 ]] && arch=arm64
          scripts/package-deb.sh "dist/morphos-cross-$VERSION-$HOST.tar.xz" dist
          for image in debian:bookworm-slim ubuntu:24.04; do
            scripts/test-deb.sh "dist/morphos-cross_${VERSION}_${arch}.deb" cache "$image"
          done
      - name: Install build prerequisites
        if: startsWith(matrix.host, 'macos-')
        run: brew install make xz
      - name: Build, package and test
        if: startsWith(matrix.host, 'macos-')
        run: JOBS="$(sysctl -n hw.ncpu)" scripts/ci-build.sh "${{ matrix.host }}"

  # The only required check in the ruleset. Matrix changes therefore do not break the repository
  # configuration.
  ci-success:
    name: CI Success
    if: always()
    needs: [commit-hygiene, quality, patches, plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every preceding job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: tools/check-ci-results.sh
